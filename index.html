<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Khyber | Choose Your Location</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#943c2c;--light:#fcf5ec;--light2:#f1e3db;--ink:#24130f;}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:'Montserrat',sans-serif;background:var(--brand);color:var(--light);display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
.container{width:100%;max-width:760px;text-align:center}
.logo{width:280px;max-width:76%;display:block;margin:0 auto 1rem}
h1{font-size:clamp(1.8rem,4vw,2.6rem);margin:.25rem 0 .4rem}
.subtitle{margin:0 auto 1.8rem;color:#f5e8dc;opacity:.94}
.locations{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:680px){.locations{grid-template-columns:1fr 1fr}}
.location-card{display:flex;flex-direction:column;min-height:220px;padding:1.4rem;background:rgba(252,245,236,.07);border:1px solid rgba(241,227,219,.28);border-radius:16px;text-decoration:none;color:var(--light);box-shadow:0 8px 24px rgba(0,0,0,.13);transition:transform .15s ease,background .15s ease}
.location-card:hover{transform:translateY(-3px);background:rgba(252,245,236,.11)}
.location-type{font-size:.78rem;text-transform:uppercase;letter-spacing:.11em;opacity:.78;margin-bottom:.55rem}
.location-card h2{margin:.1rem 0 .55rem;font-size:1.35rem}
.address{font-size:.92rem;line-height:1.45;opacity:.9;margin-bottom:1.2rem}
.cta{margin-top:auto;background:var(--light);color:var(--brand);font-weight:700;border-radius:10px;padding:.9rem 1rem}
.footer{font-size:.82rem;opacity:.76;margin-top:1.5rem}
.kch-modal-backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:99999;padding:clamp(10px,3vw,28px)}
.kch-modal{width:min(680px,96vw);background:#fff;color:#111;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.4);overflow:hidden;position:relative}
.kch-modal img{display:block;width:100%;height:auto}
.kch-close{position:absolute;top:10px;right:10px;border:0;background:rgba(0,0,0,.55);color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px}
body.kch-modal-open{overflow:hidden}
</style>
</head>
<body>
<main class="container">
  <img class="logo" src="https://i.postimg.cc/ZKG39nWY/Logo-PNG.png" alt="Khyber logo">
  <h1>Choose Your Location</h1>
  <p class="subtitle">Select a location to view its menu, ordering options, hours and more.</p>

  <div class="locations">
    <a class="location-card" href="/chai/">
      <div class="location-type">Vancouver</div>
      <h2>Khyber Chai House</h2>
      <div class="address">436 Richards St<br>Vancouver, BC</div>
      <div class="cta">View Vancouver Location</div>
    </a>

    <a class="location-card" href="/grill/">
      <div class="location-type">Surrey</div>
      <h2>Khyber Chai &amp; Grill</h2>
      <div class="address">Unit 115, 6638 152A St<br>Surrey, BC</div>
      <div class="cta">View Surrey Location</div>
    </a>
  </div>

  <div class="footer">Khyber Chai</div>
</main>

<div id="kchPromo" class="kch-modal-backdrop" role="dialog" aria-modal="true" aria-label="Promotion">
  <div class="kch-modal">
    <button class="kch-close" aria-label="Close">&times;</button>
    <img src="/banner.jpeg" alt="Khyber promotion">
  </div>
</div>

<script>
  (function(){
    const modal = document.getElementById('kchPromo');
    if(!modal) return;
    function open(){ modal.style.display='flex'; document.body.classList.add('kch-modal-open'); }
    function close(){ modal.style.display='none'; document.body.classList.remove('kch-modal-open'); }
    window.addEventListener('load', ()=> setTimeout(open, 250));
    modal.addEventListener('click', e=>{ if(e.target===modal) close(); });
    modal.querySelector('.kch-close').addEventListener('click', close);
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });
  })();
</script>
</body>
</html>
